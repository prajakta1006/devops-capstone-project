
[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = False

[flake8]
max-line-length = 127
max-complexity = 10
statistics = True
count = True

[pylint]
max-line-length = 127
